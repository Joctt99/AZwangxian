name: Build AZwangxian Tweak (FIX53S-AZ2 — WangXianHook.m架构)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          sudo mkdir -p /opt/theos
          sudo chown -R $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Setup SDK
        run: |
          mkdir -p /opt/theos/sdks
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdks.zip -C /opt/theos/sdks
          ls /opt/theos/sdks

      - name: Build Tweak
        env:
          THEOS: /opt/theos
          THEOS_MAKE_PATH: /opt/theos/makefiles
        run: |
          make clean || true
          make package FINALPACKAGE=1 2>&1 | tee build_output.log | tail -300
          echo "=== packages/ ==="
          ls -la packages/ 2>/dev/null || echo "packages/ NOT FOUND"
          echo "=== 查找所有 dylib ==="
          find . -name "*.dylib" -type f 2>/dev/null || true
          echo "=== .theos/obj 结构 ==="
          find .theos -maxdepth 5 -type d 2>/dev/null || true
          find .theos -name "*.dylib" -type f 2>/dev/null || true

          # 从 .deb 提取 .dylib (全能签注入用)
          mkdir -p dylib_out
          DEB_COUNT=$(ls packages/*.deb 2>/dev/null | wc -l | tr -d ' ')
          echo "deb数量: $DEB_COUNT"
          if [ "$DEB_COUNT" -gt 0 ]; then
            cd packages
            for deb in *.deb; do
              echo "解压 $deb ..."
              ar x "$deb" 2>/dev/null || echo "[WARN] ar x $deb failed"
              ls -la
              for f in data.tar.*; do
                if [ -f "$f" ]; then
                  echo "  解压 $f -> ../dylib_out"
                  tar -xf "$f" -C ../dylib_out 2>/dev/null || echo "[WARN] tar failed on $f"
                fi
              done
            done
            cd ..
          else
            echo "[INFO] No .deb produced — will search .theos/obj for compiled dylib"
            find .theos -name "AZwangxian.dylib" -type f -exec cp {} dylib_out/ \; 2>/dev/null || true
          fi
          echo "=== dylib_out 内容 ==="
          find dylib_out -type f -exec ls -la {} \; 2>/dev/null || echo "dylib_out 为空"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: ignore
          retention-days: 10

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZwangxian-tweak
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZwangxian-dylib
          path: |
            dylib_out/**/*.dylib
            .theos/**/*.dylib
          if-no-files-found: warn
          retention-days: 30

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            packages/*.deb
            dylib_out/**/*.dylib
            .theos/**/*.dylib
          generate_release_notes: true
