name: Build AZwangxian Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          sudo mkdir -p /opt/theos
          sudo chown -R $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Setup SDK
        run: |
          mkdir -p /opt/theos/sdks
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdks.zip -C /opt/theos/sdks
          ls /opt/theos/sdks

      - name: Build Tweak
        env:
          THEOS: /opt/theos
          THEOS_MAKE_PATH: /opt/theos/makefiles
        run: |
          make clean
          make package FINALPACKAGE=1
          ls -la packages/
          echo "=== 查找 dylib ==="
          find .theos/obj -name "*.dylib" -type f 2>/dev/null || true
          find . -name "AZwangxian.dylib" -type f 2>/dev/null || true
          # 从 .deb 提取 .dylib (全能签注入用)
          mkdir -p dylib_out
          cd packages
          for deb in *.deb; do
            ar x "$deb" data.tar.xz data.tar.lzma data.tar.gz 2>/dev/null || true
          done
          for f in data.tar.*; do
            [ -f "$f" ] && tar -xf "$f" -C ../dylib_out 2>/dev/null || true
          done
          cd ..
          echo "=== dylib_out 内容 ==="
          find dylib_out -type f || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZwangxian-tweak
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZwangxian-dylib
          path: dylib_out/**/*.dylib
          if-no-files-found: warn
          retention-days: 30

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            packages/*.deb
            dylib_out/**/*.dylib
          generate_release_notes: true
